<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}Collection{% endblock %} · mtg-tools</title>
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}" />
<style>
  /* Only what the dashboards' stylesheet doesn't already cover. Everything
     else — palette, both themes, tables, chips — comes from dashboard.css. */
  .nav { display: flex; gap: 18px; align-items: baseline; padding: 14px 0;
         border-bottom: 1px solid var(--hairline); margin-bottom: 20px; }
  .nav a { color: var(--ink-2); text-decoration: none; font-size: 14px; }
  .nav a:hover, .nav a.on { color: var(--ink); }
  .nav .brand { font-weight: 650; color: var(--ink); font-size: 15px; margin-right: 6px; }
  .nav .spacer { margin-left: auto; }
  .flash { padding: 9px 12px; border-radius: var(--r); margin-bottom: 12px;
           border: 1px solid var(--hairline); font-size: 13px; }
  .flash.ok { background: var(--accent-wash); }
  .flash.error { background: color-mix(in srgb, var(--flag) 12%, transparent);
                 border-color: var(--flag); }
  form.inline { display: inline; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
             padding: 10px 12px; background: var(--surface);
             border: 1px solid var(--hairline); border-radius: var(--r);
             margin-bottom: 14px; }
  .toolbar.armed { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .muted { color: var(--ink-muted); font-size: 12px; }
  .danger { color: var(--flag); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px;
          border: 1px solid var(--hairline); font-size: 11px; color: var(--ink-2); }
  .pill.sell { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .pill.keep { background: var(--ink-2); color: var(--surface); border-color: transparent; }
  .issue { border: 1px solid var(--hairline); border-radius: var(--r);
           padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
  .issue h3 { margin: 0 0 6px; font-size: 13px; }
  .issue.blocking { border-left: 3px solid var(--flag); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span class="brand">mtg-tools</span>
    <a href="{{ url_for('collection') }}" class="{{ 'on' if request.endpoint == 'collection' }}">Collection</a>
    <a href="{{ url_for('imports') }}" class="{{ 'on' if request.endpoint in ('imports','review') }}">Import</a>
    <a href="{{ url_for('history') }}" class="{{ 'on' if request.endpoint == 'history' }}">History</a>
    <span class="spacer"></span>
    {% if undoable %}
      <form method="post" action="{{ url_for('undo') }}" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf_token }}" />
        <input type="hidden" name="back" value="{{ request.full_path }}" />
        <button class="btn" type="submit" title="{{ undoable.summary }}">
          ↶ Undo: {{ undoable.summary|truncate(46) }}
        </button>
      </form>
    {% endif %}
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  {% block body %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
