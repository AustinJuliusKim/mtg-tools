# One distribution carrying both packages. `binders` stays stdlib-only at
# import time — Flask below belongs to the distribution, and
# tests_webapp/test_boundary.py keeps enforcing that the library never
# actually imports it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-tools"
version = "0.1.0"
description = "Local-first Magic: The Gathering collection manager — web app, CLI, and self-contained dashboards over ManaBox exports."
readme = "README.md"
# SPDX expression on purpose: it needs no file at build time, so this branch
# and the one adding LICENSE can merge in either order.
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "flask>=2.3,<4",
]
keywords = ["mtg", "magic-the-gathering", "collection", "manabox", "tcg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
mtg-tools = "binders.cli:main"

[project.urls]
Homepage = "https://github.com/AustinJuliusKim/mtg-tools"
Source = "https://github.com/AustinJuliusKim/mtg-tools"

# The wheel ships the built front end at `webapp/_dist` (webapp/app.py resolves
# DIST there when it exists), so `npm --prefix frontend run build` must run
# BEFORE `python -m build`. frontend/dist is gitignored; `artifacts` re-includes
# it for packaging, and a missing build fails the packaging step loudly rather
# than shipping a wheel that 503s.
[tool.hatch.build]
artifacts = ["frontend/dist"]

[tool.hatch.build.targets.wheel]
packages = ["binders", "webapp"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "webapp/_dist"

[tool.hatch.build.targets.sdist]
include = [
    "binders",
    "webapp",
    "frontend/dist",
    "requirements.txt",
]
